# Default configuration for CRF experiments
# This file contains all hyperparameters and settings

model:
  type: "crf"  # Options: crf, transformer
  d_model: 128
  d_hidden: 64
  n_init_cells: 32
  max_cells: 128
  n_crf_steps: 6
  k_neighbors: 4
  max_seq_len: 128
  
  # Ablation settings
  ablation: "full"  # Options: full, no_split_death, no_merge, no_routing, no_energy, no_messaging, no_spatial
  
  # Energy parameters
  energy_split_threshold: 1.05
  energy_death_threshold: 0.01
  energy_merge_threshold: 0.95
  spatial_lambda: 0.05

training:
  n_epochs: 10
  batch_size: 32
  lr: 3e-4
  lr_min: 3e-5
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 100
  
  # Optimizer settings
  optimizer: "adamw"
  beta1: 0.9
  beta2: 0.95
  
  # Mixed precision
  use_amp: false
  
  # Distributed training
  distributed: false
  world_size: 1

data:
  dataset: "synthetic"  # Options: synthetic, tinystories, arithmetic, arc, humaneval, gsm8k
  seq_len: 64
  max_train: 1500
  max_val: 300
  num_workers: 0
  pin_memory: false
  
  # Tokenizer
  vocab_size: 99
  tokenizer_type: "char"  # Options: char, word, subword

evaluation:
  metrics:
    - "perplexity"
    - "accuracy"
    - "crf_metrics"
  
  # Validation frequency
  val_every_n_epochs: 1
  
  # Early stopping
  early_stopping: false
  patience: 5

experiment:
  name: "crf_experiment"
  seed: 42
  run_name: null  # Auto-generated if null
  
  # Logging
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  
  # Experiment tracking
  use_tensorboard: true
  use_wandb: false
  wandb_project: "crf-research"
  
  # Reproducibility
  deterministic: true
  benchmark: false

hardware:
  device: "cuda"  # Options: cuda, cpu, auto
  gpu_ids: [0]  # List of GPU IDs to use
  
profiling:
  profile: false
  memory_tracking: false
  flops_tracking: true

scaling:
  # Scaling sweeps
  scale_cells: [8, 16, 32, 64]
  scale_steps: [2, 4, 6, 8]
  scale_d_model: [64, 128, 256]
